name: Build VoiceClone AI Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          unzip -q VoiceCloneAIStudio_Android_Starter.zip -d extracted
          ANDROID_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

      - name: Show build file
        run: head -n 15 "$ANDROID_DIR/app/build.gradle.kts"

      - name: Build APK
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCloneAIStudio-APK
          path: "**/build/outputs/apk/debug/*.apk"
